[workspace]
resolver = "2"
members = [
    "crates/crustf-spec",
    "crates/crustf-asm",
    "crates/crustf-jar-builder",
    "crates/crustf",
    "examples",
    "tests/jvm-integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/topi-banana/crustf"
authors = ["crustf contributors"]
description = "Pure Rust JVM class-file emitter with a fluent assembler-style builder"
keywords = ["jvm", "bytecode", "classfile", "assembler", "java"]
categories = ["compilers", "encoding", "no-std"]

[workspace.dependencies]
crustf-spec = { version = "0.1.0", path = "crates/crustf-spec", default-features = false }
crustf-asm = { version = "0.1.0", path = "crates/crustf-asm", default-features = false }
crustf-jar-builder = { version = "0.1.0", path = "crates/crustf-jar-builder", default-features = false }
crustf = { version = "0.1.0", path = "crates/crustf", default-features = false }

bitflags = { version = "2.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Deny real bug classes, let style bikesheds stay silent.
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
suspicious = { level = "deny", priority = 0 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
